<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>時間的女兒互動時間軸</title>


<style>

/* =========================
   基本設定
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

    background: #f5f3ef;

    color: #292929;
}


/* =========================
   標題
========================= */

header {

    background: #222;

    color: white;

    padding: 30px 40px;
}

header h1 {

    margin: 0 0 8px;

    font-size: 30px;
}

header p {

    margin: 0;

    color: #ccc;
}


/* =========================
   主畫面
========================= */

.container {

    display: flex;

    gap: 25px;

    padding: 30px;
}


/* =========================
   時間軸
========================= */

.timeline-area {

    flex: 1;

    background: white;

    border-radius: 12px;

    padding: 25px;

    overflow-x: auto;
}


/* =========================
   年份
========================= */

.years {

    position: relative;

    height: 35px;

    margin-left: 160px;

    min-width: 900px;

    border-bottom: 1px solid #ddd;
}

.year {

    position: absolute;

    top: 0;

    transform: translateX(-50%);

    color: #777;

    font-size: 13px;
}


/* =========================
   國家
========================= */

.country {

    display: grid;

    grid-template-columns: 160px 1fr;

    min-width: 900px;

    min-height: 140px;

    border-bottom: 1px solid #ddd;
}


.country-name {

    padding: 25px 10px;

    font-weight: bold;

    font-size: 17px;
}


/* =========================
   君王區域
========================= */

.rulers {

    position: relative;

    height: 140px;
}


/* =========================
   君王長條
========================= */

.ruler {

    position: absolute;

    height: 42px;

    border: none;

    border-radius: 7px;

    padding: 6px 10px;

    color: white;

    text-align: left;

    cursor: pointer;

    overflow: hidden;

    transition: 0.2s;
}

.ruler:hover {

    transform: translateY(-2px);

    box-shadow:
        0 5px 12px
        rgba(0,0,0,0.2);
}


.ruler-name {

    font-size: 13px;

    font-weight: 600;

    white-space: nowrap;
}


.ruler-years {

    font-size: 10px;

    margin-top: 3px;

    opacity: 0.85;

    white-space: nowrap;
}


/* =========================
   國家顏色
========================= */

.england {

    background: #5b7db1;
}

.france {

    background: #b85c5c;
}

.hre {

    background: #8b6aa9;
}


/* =========================
   資訊面板
========================= */

.info-panel {

    width: 330px;

    background: white;

    border-radius: 12px;

    padding: 25px;

    height: fit-content;

    position: sticky;

    top: 20px;

    box-shadow:
        0 3px 15px
        rgba(0,0,0,0.08);
}


.info-panel h2 {

    margin-top: 0;

    font-size: 24px;
}


.info-item {

    margin-bottom: 16px;
}


.info-label {

    font-size: 12px;

    color: #888;

    margin-bottom: 4px;
}


.info-value {

    font-size: 16px;

    font-weight: 500;

    line-height: 1.6;
}


.info-panel hr {

    border: none;

    border-top: 1px solid #ddd;

    margin: 20px 0;
}


/* =========================
   Podcast
========================= */

.podcast-item {

    padding: 12px;

    background: #f5f3ef;

    border-radius: 8px;

    margin-bottom: 10px;
}


.podcast-title {

    font-size: 14px;

    font-weight: 600;

    margin-bottom: 7px;
}


.podcast-link {

    font-size: 13px;

    color: #4267a9;

    text-decoration: none;
}


.podcast-link:hover {

    text-decoration: underline;
}


/* =========================
   Wikipedia
========================= */

.wikipedia-link {

    color: #4267a9;

    text-decoration: none;
}


.wikipedia-link:hover {

    text-decoration: underline;
}


/* =========================
   手機版
========================= */

@media (max-width: 900px) {

    .container {

        flex-direction: column;
    }

    .info-panel {

        width: 100%;

        position: relative;
    }

}

</style>

</head>


<body>


<header>

<h1>
時間的女兒互動時間軸
</h1>

<p>
Timeline for DOT
｜1300–1950
</p>

</header>


<div class="container">


<div class="timeline-area">
<div class="timeline-controls">

    <button id="zoomOut">
        −
    </button>

    <span id="zoomLevel">
        100 年
    </span>

    <button id="zoomIn">
        ＋
    </button>

</div>
    <div
        class="years"
        id="years">
    </div>

    <div id="timeline"></div>

</div>


<aside
    class="info-panel"
    id="infoPanel">

    <h2>
        選擇一位君王
    </h2>

    <p>
        點擊時間軸上的君王，
        這裡會顯示詳細資訊。
    </p>

</aside>


</div>



<script>

/* ===================================
   時間範圍
=================================== */

const START_YEAR = 1300;

const END_YEAR = 1950;


/* ===================================
   Google Sheet
=================================== */

const RULERS_SHEET_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vRVkmsLln3MzZ7wG4hR7d-XsSZ6YPGARzDmrzMk61yO_qNdMjW4JA9lvUD1V7F6T1ArXQ4RJSk3W0TW/pub?output=csv";


/*
    這裡先假設第二張工作表
    是另外發布的 CSV。

    等第一張確認正常後，
    我們再接第二張。
*/

const PODCAST_SHEET_URL =
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vRVkmsLln3MzZ7wG4hR7d-XsSZ6YPGARzDmrzMk61yO_qNdMjW4JA9lvUD1V7F6T1ArXQ4RJSk3W0TW/pub?gid=1372564525&single=true&output=csv";

/* ===================================
   全域資料
=================================== */

let rulersData = [];

let podcastsData = [];


/* ===================================
   年份 → 百分比
=================================== */

function yearToPercent(year) {

    return (
        (year - START_YEAR)
        /
        (END_YEAR - START_YEAR)
    ) * 100;

}


/* ===================================
   建立年份
=================================== */

function createYears() {

    const years =
        document.getElementById("years");


    years.innerHTML = "";


    for (
        let year = START_YEAR;
        year <= END_YEAR;
        year += 100
    ) {

        const element =
            document.createElement("div");


        element.className =
            "year";


        element.innerText =
            year;


        element.style.left =
            yearToPercent(year) + "%";


        years.appendChild(element);

    }

}


/* ===================================
   判斷國家顏色
=================================== */

function getCountryClass(
    country
) {

    if (
        country.includes("法國")
    ) {

        return "france";

    }


    if (
        country.includes("神聖羅馬帝國")
    ) {

        return "hre";

    }


    return "england";

}


/* ===================================
   建立時間軸
=================================== */

function createTimeline(
    data
) {

    const timeline =
        document.getElementById(
            "timeline"
        );


    timeline.innerHTML = "";


    /*
        按國家分類
    */

    const grouped = {};


    data.forEach(
        ruler => {

        if (
            !grouped[ruler.country]
        ) {

            grouped[ruler.country] = [];

        }


        grouped[ruler.country]
            .push(ruler);

    });


    /*
        建立國家
    */

    Object.keys(grouped)
        .forEach(
            countryName => {


        const countryElement =
            document.createElement(
                "div"
            );


        countryElement.className =
            "country";


        /*
            國家名稱
        */

        const countryNameElement =
            document.createElement(
                "div"
            );


        countryNameElement.className =
            "country-name";


        countryNameElement.innerText =
            countryName;


        countryElement.appendChild(
            countryNameElement
        );


        /*
            君王區域
        */

        const rulers =
            document.createElement(
                "div"
            );


        rulers.className =
            "rulers";


        grouped[countryName]
            .forEach(
                (ruler, index) => {


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "ruler "
                +
                getCountryClass(
                    countryName
                );


            /*
                計算位置
            */

            const left =
                yearToPercent(
                    ruler.start
                );


            const right =
                yearToPercent(
                    ruler.end
                );


            const width =
                right - left;


            button.style.left =
                left + "%";


            button.style.width =
                width + "%";


            /*
                上下排列
            */

            button.style.top =
                (index % 2) * 55
                + 10
                + "px";


            /*
                顯示文字
            */

            button.innerHTML = `

                <div class="ruler-name">
                    ${ruler.ruler}
                </div>

                <div class="ruler-years">
                    ${ruler.start}
                    –
                    ${ruler.end}
                </div>

            `;


            /*
                點擊
            */

            button.onclick =
                function() {

                    showRuler(
                        ruler
                    );

                };


            rulers.appendChild(
                button
            );

        });


        countryElement.appendChild(
            rulers
        );


        timeline.appendChild(
            countryElement
        );

    });

}

/* ===================================
   Apple Podcast Embed URL
=================================== */

function getAppleEmbedURL(url) {

    try {

        const parsedURL =
            new URL(url);


        const podcastID =
            parsedURL
                .pathname
                .match(
                    /\/id(\d+)/
                );


        const episodeID =
            parsedURL
                .searchParams
                .get("i");


        if (
            !podcastID
            ||
            !episodeID
        ) {

            console.error(
                "無法解析 Apple Podcast URL：",
                url
            );

            return "";

        }


        return `
            https://embed.podcasts.apple.com/tw/podcast/
            ${podcastID[1]}
            ?i=${episodeID}
        `.replace(/\s+/g, "");

    }

    catch (error) {

        console.error(
            "Apple Podcast URL 解析失敗：",
            error
        );

        return "";

    }

}
/* ===================================
   顯示君王資訊
=================================== */

function showRuler(ruler) {

    const panel =
        document.getElementById("infoPanel");


    /* ===================================
       找出這位君王的所有 Podcast
    =================================== */

    const rulerPodcasts =
        podcastsData
            .filter(
                podcast =>
                    String(podcast.ruler_id)
                    ===
                    String(ruler.id)
            )
            .sort(
                (a, b) =>
                    a.order - b.order
            );


    /* ===================================
       建立 Podcast HTML
    =================================== */

    let podcastHTML = "";


    if (rulerPodcasts.length > 0) {

        podcastHTML =
            rulerPodcasts
                .map(
                    podcast => `

                    <div class="podcast-item">

    <div class="podcast-title">

        🎧 ${podcast.title}

    </div>

    <iframe
        src="${getAppleEmbedURL(podcast.url)}"
        width="100%"
        height="175"
        frameborder="0"
        allow="autoplay *; encrypted-media *; fullscreen *"
        style="
            width: 100%;
            border-radius: 10px;
            margin-top: 8px;
        ">
    </iframe>

</div>

                    `
                )
                .join("");

    } else {

        podcastHTML = `

            <p>
                目前沒有 Podcast。
            </p>

        `;

    }


    /* ===================================
       Wikipedia
    =================================== */

    let wikipediaHTML = "";


    if (ruler.wikipedia) {

        wikipediaHTML = `

            <a
                class="wikipedia-link"
                href="${ruler.wikipedia}"
                target="_blank"
                rel="noopener noreferrer">

                閱讀 Wikipedia

            </a>

        `;

    } else {

        wikipediaHTML = `

            <p>
                目前沒有 Wikipedia 連結。
            </p>

        `;

    }


    /* ===================================
       顯示資訊面板
    =================================== */

    panel.innerHTML = `

        <h2>
            ${ruler.ruler}
        </h2>


        <div class="info-item">

            <div class="info-label">
                國家
            </div>

            <div class="info-value">
                ${ruler.country}
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                在位期間
            </div>

            <div class="info-value">
                ${ruler.start}
                –
                ${ruler.end}
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                王朝
            </div>

            <div class="info-value">
                ${ruler.dynasty}
            </div>

        </div>


        <hr>


        <div class="info-item">

            <div class="info-label">
                人物介紹
            </div>

            <div class="info-value">

                ${
                    ruler.description
                    ||
                    "目前沒有介紹資料。"
                }

            </div>

        </div>


        <hr>


        <div class="info-item">

            <div class="info-label">
                🎧 Podcast
            </div>

            ${podcastHTML}

        </div>


        <hr>


        <div class="info-item">

            <div class="info-label">
                📚 延伸閱讀
            </div>

            ${wikipediaHTML}

        </div>

    `;

}


/* ===================================
   CSV 解析
=================================== */

function parseCSV(
    csv
) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < csv.length;
        i++
    ) {

        const char =
            csv[i];


        const nextChar =
            csv[i + 1];


        if (
            char === '"'
            &&
            nextChar === '"'
        ) {

            value += '"';

            i++;

        }

        else if (
            char === '"'
        ) {

            insideQuotes =
                !insideQuotes;

        }

        else if (
            char === ","
            &&
            !insideQuotes
        ) {

            row.push(
                value
            );

            value = "";

        }

        else if (
            (char === "\n"
            ||
            char === "\r")
            &&
            !insideQuotes
        ) {

            if (
                char === "\r"
                &&
                nextChar === "\n"
            ) {

                i++;

            }


            row.push(
                value
            );

            rows.push(
                row
            );

            row = [];

            value = "";

        }

        else {

            value += char;

        }

    }


    if (
        value !== ""
        ||
        row.length > 0
    ) {

        row.push(value);

        rows.push(row);

    }


    return rows;

}


/* ===================================
   讀取君王 Google Sheet
=================================== */

async function loadRulersSheet() {

    try {

        const response =
            await fetch(
                RULERS_SHEET_URL
            );


        if (!response.ok) {

            throw new Error(
                "Google Sheet 無法讀取"
            );

        }


        const csv =
            await response.text();


        console.log(
            "Google Sheet 原始資料：",
            csv
        );


        const rows =
            parseCSV(csv);


        const headers =
            rows[0].map(
                header =>
                    header.trim()
            );


        console.log(
            "Google Sheet 欄位：",
            headers
        );


        rulersData =
            rows
                .slice(1)
                .map(
                    values => {

                        const item = {};


                        const get =
                            columnName => {

                                const index =
                                    headers.indexOf(
                                        columnName
                                    );


                                return (
                                    index !== -1
                                    &&
                                    values[index] !== undefined
                                )
                                    ? values[index].trim()
                                    : "";

                            };


                        item.id =
                            get("id");


                        item.country =
                            get("country");


                        item.ruler =
                            get("ruler");


                        item.dynasty =
                            get("dynasty");


                        item.start =
                            Number(
                                get("start")
                            );


                        item.end =
                            Number(
                                get("end")
                            );


                        item.description =
                            get("description");


                        item.wikipedia =
                            get("wikipedia");


                        return item;

                    }
                )
                .filter(
                    ruler =>
                        ruler.country
                        &&
                        ruler.ruler
                        &&
                        Number.isFinite(
                            ruler.start
                        )
                        &&
                        Number.isFinite(
                            ruler.end
                        )
                );


        console.log(
            "整理後君王資料：",
            rulersData
        );


        createTimeline(
            rulersData
        );


    }

    catch (error) {

        console.error(
            "讀取君王 Google Sheet 失敗：",
            error
        );

    }

}
/* ===================================
   讀取 Podcast Google Sheet
=================================== */

async function loadPodcastsSheet() {

    try {

        const response =
            await fetch(
                PODCAST_SHEET_URL
            );


        if (!response.ok) {

            throw new Error(
                "Podcast Google Sheet 無法讀取"
            );

        }


        const csv =
            await response.text();


        console.log(
            "Podcast Google Sheet 原始資料：",
            csv
        );


        const rows =
            parseCSV(csv);


        console.log(
            "Podcast Google Sheet 資料：",
            rows
        );


        const headers =
            rows[0].map(
                header =>
                    header.trim()
            );


        console.log(
            "Podcast Google Sheet 欄位：",
            headers
        );


        podcastsData =
            rows
                .slice(1)
                .map(
                    values => {

                        const get =
                            columnName => {

                                const index =
                                    headers.indexOf(
                                        columnName
                                    );


                                return (
                                    index !== -1
                                    &&
                                    values[index] !== undefined
                                )
                                    ? values[index].trim()
                                    : "";

                            };


                        return {

                            ruler_id:
                                get("ruler_id"),

                            url:
                                get("url"),

                            order:
                                Number(
                                    get("order")
                                )
                                || 0,

                            title:
                                get("Title")

                        };

                    }
                )
                .filter(
                    podcast =>
                        podcast.ruler_id
                        &&
                        podcast.url
                );


        console.log(
            "整理後 Podcast 資料：",
            podcastsData
        );


    }

    catch (error) {

        console.error(
            "讀取 Podcast Google Sheet 失敗：",
            error
        );

    }

}
/* ===================================
   測試 Apple Podcast
=================================== */

async function testApplePodcast() {

    const testURL =
        "https://podcasts.apple.com/tw/podcast/%E6%99%82%E9%96%93%E7%9A%84%E5%A5%B3%E5%85%92-%E5%85%AB%E5%8D%A6%E6%AD%B7%E5%8F%B2/id1549521834?i=1000505640715";


    console.log(
        "開始測試 Apple Podcast：",
        testURL
    );


    try {

        const response =
            await fetch(
                "https://itunes.apple.com/lookup?id=1000505640715&entity=podcastEpisode"
            );


        const data =
            await response.json();


        console.log(
            "Apple Podcast API 回傳：",
            data
        );


        if (
            data.results
            &&
            data.results.length > 0
        ) {

            console.log(
                "🎧 Podcast 單集名稱：",
                data.results[0].trackName
            );

        } else {

            console.log(
                "找不到這一集 Podcast"
            );

        }

    }

    catch (error) {

        console.error(
            "Apple Podcast API 讀取失敗：",
            error
        );

    }

}

      

/* ===================================
   啟動
=================================== */

createYears();

loadRulersSheet();

loadPodcastsSheet();

testApplePodcast();

/* ===================================
   時間軸縮放
=================================== */

let timelineZoom = 1;


const zoomInButton =
    document.getElementById(
        "zoomIn"
    );


const zoomOutButton =
    document.getElementById(
        "zoomOut"
    );


const zoomLevel =
    document.getElementById(
        "zoomLevel"
    );


function updateTimelineZoom() {

    const timeline =
        document.getElementById(
            "timeline"
        );


    const years =
        document.getElementById(
            "years"
        );


    timeline.style.width =
        (timelineZoom * 100)
        + "%";


    years.style.width =
        (timelineZoom * 100)
        + "%";


    zoomLevel.innerText =
        Math.round(
            100 / timelineZoom
        )
        + " 年";


    console.log(
        "時間軸 Zoom：",
        timelineZoom
    );

}


zoomInButton.onclick =
    function() {

        timelineZoom *= 1.5;

        updateTimelineZoom();

    };


zoomOutButton.onclick =
    function() {

        timelineZoom /= 1.5;


        if (
            timelineZoom < 1
        ) {

            timelineZoom = 1;

        }


        updateTimelineZoom();

    };


updateTimelineZoom();
      
</script>


</body>

</html>
