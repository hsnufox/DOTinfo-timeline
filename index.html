```html    
<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>歐洲歷史互動時間軸</title>


<style>

/* =========================
   基本設定
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

    background: #f5f3ef;

    color: #292929;
}


/* =========================
   標題
========================= */

header {

    background: #222;

    color: white;

    padding: 30px 40px;
}

header h1 {

    margin: 0 0 8px;

    font-size: 30px;
}

header p {

    margin: 0;

    color: #ccc;
}


/* =========================
   主畫面
========================= */

.container {

    display: flex;

    gap: 25px;

    padding: 30px;
}


/* =========================
   時間軸區域
========================= */

.timeline-area {

    flex: 1;

    background: white;

    border-radius: 12px;

    padding: 25px;

    overflow-x: auto;
}


/* =========================
   年份
========================= */

.years {

    position: relative;

    height: 35px;

    margin-left: 160px;

    min-width: 900px;

    border-bottom: 1px solid #ddd;
}

.year {

    position: absolute;

    top: 0;

    transform: translateX(-50%);

    color: #777;

    font-size: 13px;
}


/* =========================
   國家
========================= */

.country {

    display: grid;

    grid-template-columns: 160px 1fr;

    min-width: 900px;

    min-height: 140px;

    border-bottom: 1px solid #ddd;
}


.country-name {

    padding: 25px 10px;

    font-weight: bold;

    font-size: 17px;
}


/* =========================
   君王區域
========================= */

.rulers {

    position: relative;

    height: 140px;
}


/* =========================
   君王長條
========================= */

.ruler {

    position: absolute;

    height: 42px;

    border: none;

    border-radius: 7px;

    padding: 6px 10px;

    color: white;

    text-align: left;

    cursor: pointer;

    overflow: hidden;

    transition: 0.2s;
}

.ruler:hover {

    transform: translateY(-2px);

    box-shadow:
        0 5px 12px
        rgba(0,0,0,0.2);
}


.ruler-name {

    font-size: 13px;

    font-weight: 600;

    white-space: nowrap;
}


.ruler-years {

    font-size: 10px;

    margin-top: 3px;

    opacity: 0.85;

    white-space: nowrap;
}


/* =========================
   國家顏色
========================= */

.england {

    background: #5b7db1;
}

.france {

    background: #b85c5c;
}

.hre {

    background: #8b6aa9;
}


/* =========================
   資訊面板
========================= */

.info-panel {

    width: 330px;

    background: white;

    border-radius: 12px;

    padding: 25px;

    height: fit-content;

    position: sticky;

    top: 20px;

    box-shadow:
        0 3px 15px
        rgba(0,0,0,0.08);
}


.info-panel h2 {

    margin-top: 0;

    font-size: 24px;
}


.info-item {

    margin-bottom: 16px;
}


.info-label {

    font-size: 12px;

    color: #888;

    margin-bottom: 4px;
}


.info-value {

    font-size: 16px;

    font-weight: 500;

    line-height: 1.6;
}


.info-panel hr {

    border: none;

    border-top: 1px solid #ddd;

    margin: 20px 0;
}


.info-panel a {

    color: #4267a9;

    text-decoration: none;
}


.info-panel a:hover {

    text-decoration: underline;
}


/* =========================
   手機版
========================= */

@media (max-width: 900px) {

    .container {

        flex-direction: column;
    }

    .info-panel {

        width: 100%;

        position: relative;
    }

}

</style>

</head>


<body>


<header>

<h1>
歐洲歷史互動時間軸
</h1>

<p>
England · France · Holy Roman Empire
｜1000–1600
</p>

</header>



<div class="container">


<!-- =================================
     時間軸
================================= -->

<div class="timeline-area">


<div
    class="years"
    id="years">
</div>


<div id="timeline"></div>


</div>



<!-- =================================
     資訊面板
================================= -->

<aside
    class="info-panel"
    id="infoPanel">

<h2>
選擇一位君王
</h2>

<p>
點擊時間軸上的君王，
這裡會顯示詳細資訊。
</p>

</aside>


</div>



<script>

/* ===================================
   時間範圍
=================================== */

const START_YEAR = 1000;

const END_YEAR = 1600;


/* ===================================
   年份 → 百分比
=================================== */

function yearToPercent(year) {

    return (
        (year - START_YEAR)
        /
        (END_YEAR - START_YEAR)
    ) * 100;

}


/* ===================================
   建立年份
=================================== */

function createYears() {

    const years =
        document.getElementById("years");


    years.innerHTML = "";


    for (
        let year = START_YEAR;
        year <= END_YEAR;
        year += 100
    ) {

        const element =
            document.createElement("div");


        element.className =
            "year";


        element.innerText =
            year;


        element.style.left =
            yearToPercent(year) + "%";


        years.appendChild(element);

    }

}


/* ===================================
   顯示君王資訊
=================================== */

function showRuler(
    ruler,
    country
) {

    const panel =
        document.getElementById(
            "infoPanel"
        );


    panel.innerHTML = `

        <h2>
            ${ruler.ruler}
        </h2>


        <div class="info-item">

            <div class="info-label">
                國家
            </div>

            <div class="info-value">
                ${country.name}
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                在位期間
            </div>

            <div class="info-value">
                ${ruler.start}
                –
                ${ruler.end}
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                王朝
            </div>

            <div class="info-value">
                ${ruler.dynasty}
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                人物介紹
            </div>

            <div class="info-value">

                ${
                    ruler.description
                    ||
                    "目前沒有介紹資料。"
                }

            </div>

        </div>


        <hr>


        <div class="info-item">

            <div class="info-label">
                🎧 Podcast / YouTube
            </div>

            ${
                ruler.podcast
                ?
                `
                <a
                    href="${ruler.podcast}"
                    target="_blank"
                    rel="noopener noreferrer">

                    開啟影音內容

                </a>
                `
                :
                `
                <p>
                    目前沒有影音連結。
                </p>
                `
            }

        </div>


        <div class="info-item">

            <div class="info-label">
                📚 Wikipedia
            </div>

            ${
                ruler.wikipedia
                ?
                `
                <a
                    href="${ruler.wikipedia}"
                    target="_blank"
                    rel="noopener noreferrer">

                    閱讀 Wikipedia

                </a>
                `
                :
                `
                <p>
                    目前沒有 Wikipedia 連結。
                </p>
                `
            }

        </div>

    `;

}


/* ===================================
   Google Sheet
=================================== */

async function loadGoogleSheet() {

    const sheetURL =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vRVkmsLln3MzZ7wG4hR7d-XsSZ6YPGARzDmrzMk61yO_qNdMjW4JA9lvUD1V7F6T1ArXQ4RJSk3W0TW/pub?output=csv";


    try {

        const response =
            await fetch(sheetURL);


        if (!response.ok) {

            throw new Error(
                "Google Sheet 無法讀取"
            );

        }


        const csv =
            await response.text();


        console.log(
            "Google Sheets 原始資料：",
            csv
        );


        const rows =
            csv
            .trim()
            .split(/\r?\n/);


        const data =
            rows
            .slice(1)
            .map(row => {

               const values =
    row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)
        ?.map(value =>
            value.replace(/^"|"$/g, "").trim()
        ) || [];


const item = {};

item.id = values[0] || "";
item.country = values[1] || "";
item.ruler = values[2] || "";
item.dynasty = values[3] || "";
item.start = Number(values[4]);
item.end = Number(values[5]);
item.description = values[6] || "";
item.wikipedia = values[7] || "";
item.podcast = values[8] || "";

return item;

            });


        console.log(
            "Google Sheets 整理後資料：",
            data
        );


        createTimelineFromSheet(
            data
        );


    } catch (error) {

        console.error(
            "讀取 Google Sheets 失敗：",
            error
        );

    }

}


/* ===================================
   Google Sheet → 時間軸
=================================== */

function createTimelineFromSheet(
    data
) {

    const timeline =
        document.getElementById(
            "timeline"
        );


    timeline.innerHTML = "";


    /* =========================
       過濾無效資料
    ========================= */

    const validData =
        data.filter(ruler => {

            return (
                ruler.country &&
                ruler.ruler &&
                Number.isFinite(
                    ruler.start
                ) &&
                Number.isFinite(
                    ruler.end
                )
            );

        });


    /* =========================
       按國家分類
    ========================= */

    const groupedCountries = {};


    validData.forEach(
        ruler => {

        if (
            !groupedCountries[
                ruler.country
            ]
        ) {

            groupedCountries[
                ruler.country
            ] = [];

        }


        groupedCountries[
            ruler.country
        ].push(ruler);

    });


    /* =========================
       建立國家列
    ========================= */

    Object.keys(
        groupedCountries
    ).forEach(
        countryName => {


        const countryElement =
            document.createElement(
                "div"
            );


        countryElement.className =
            "country";


        /* 國家名稱 */

        const countryNameElement =
            document.createElement(
                "div"
            );


        countryNameElement.className =
            "country-name";


        countryNameElement.innerText =
            countryName;


        countryElement.appendChild(
            countryNameElement
        );


        /* 君王區域 */

        const rulers =
            document.createElement(
                "div"
            );


        rulers.className =
            "rulers";


        /* =========================
           建立君王
        ========================= */

        groupedCountries[
            countryName
        ].forEach(
            (ruler, index) => {


            const button =
                document.createElement(
                    "button"
                );


            /* =========================
               國家顏色
            ========================= */

            let countryClass =
                "england";


            if (
                countryName.includes(
                    "法國"
                )
            ) {

                countryClass =
                    "france";

            }


            if (
                countryName.includes(
                    "神聖羅馬帝國"
                )
            ) {

                countryClass =
                    "hre";

            }


            button.className =
                "ruler "
                +
                countryClass;


            /* =========================
               年份位置
            ========================= */

            const left =
                yearToPercent(
                    ruler.start
                );


            const right =
                yearToPercent(
                    ruler.end
                );


            const width =
                right - left;


            button.style.left =
                left + "%";


            button.style.width =
                width + "%";


            /* =========================
               上下排列
            ========================= */

            button.style.top =
                (index % 2) * 55
                + 10
                + "px";


            /* =========================
               君王文字
            ========================= */

            button.innerHTML = `

                <div class="ruler-name">

                    ${ruler.ruler}

                </div>

                <div class="ruler-years">

                    ${ruler.start}
                    –
                    ${ruler.end}

                </div>

            `;


            /* =========================
               點擊事件
            ========================= */

            button.onclick =
                function() {

                    showRuler(
                        ruler,
                        {
                            name:
                                countryName
                        }
                    );

                };


            rulers.appendChild(
                button
            );

        });


        countryElement.appendChild(
            rulers
        );


        timeline.appendChild(
            countryElement
        );

    });

async function testApplePodcast() {

    const podcastURL =
        "https://podcasts.apple.com/tw/podcast/%E6%99%82%E9%96%93%E7%9A%84%E5%A5%B3%E5%85%92-%E5%85%AB%E5%8D%A6%E6%AD%B7%E5%8F%B2/id1549521834?i=1000505640715";


    const match =
        podcastURL.match(
            /id(\d+).*?[?&]i=(\d+)/
        );


    if (!match) {

        console.error(
            "無法從網址取得 Podcast ID"
        );

        return;

    }


    const podcastId =
        match[1];


    const episodeId =
        match[2];


    console.log(
        "Podcast ID:",
        podcastId
    );


    console.log(
        "Episode ID:",
        episodeId
    );

}


/* ===================================
   啟動
=================================== */

createYears();

loadGoogleSheet();

testApplePodcast();
      
</script>


</body>

</html>
