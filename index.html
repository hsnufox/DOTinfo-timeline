<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>歐洲歷史互動時間軸</title>


<style>

/* =========================
   基本設定
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

    background: #f5f3ef;

    color: #292929;
}


/* =========================
   標題
========================= */

header {

    background: #222;

    color: white;

    padding: 30px 40px;
}

header h1 {

    margin: 0 0 8px;

    font-size: 30px;
}

header p {

    margin: 0;

    color: #ccc;
}


/* =========================
   主畫面
========================= */

.container {

    display: flex;

    gap: 25px;

    padding: 30px;
}


/* =========================
   時間軸區域
========================= */

.timeline-area {

    flex: 1;

    background: white;

    border-radius: 12px;

    padding: 25px;

    overflow-x: auto;
}


/* =========================
   年份
========================= */

.years {

    position: relative;

    height: 35px;

    margin-left: 160px;

    min-width: 900px;

    border-bottom: 1px solid #ddd;
}

.year {

    position: absolute;

    top: 0;

    transform: translateX(-50%);

    color: #777;

    font-size: 13px;
}


/* =========================
   國家
========================= */

.country {

    display: grid;

    grid-template-columns: 160px 1fr;

    min-width: 900px;

    min-height: 140px;

    border-bottom: 1px solid #ddd;
}


.country-name {

    padding: 25px 10px;

    font-weight: bold;

    font-size: 17px;
}


/* =========================
   君王區域
========================= */

.rulers {

    position: relative;

    height: 140px;
}


/* =========================
   君王長條
========================= */

.ruler {

    position: absolute;

    height: 42px;

    border: none;

    border-radius: 7px;

    padding: 6px 10px;

    color: white;

    text-align: left;

    cursor: pointer;

    overflow: hidden;

    transition: 0.2s;
}

.ruler:hover {

    transform: translateY(-2px);

    box-shadow:
        0 5px 12px
        rgba(0,0,0,0.2);
}


.ruler-name {

    font-size: 13px;

    font-weight: 600;

    white-space: nowrap;
}


.ruler-years {

    font-size: 10px;

    margin-top: 3px;

    opacity: 0.85;

    white-space: nowrap;
}


/* =========================
   國家顏色
========================= */

.england {

    background: #5b7db1;
}

.france {

    background: #b85c5c;
}

.hre {

    background: #8b6aa9;
}


/* =========================
   資訊面板
========================= */

.info-panel {

    width: 330px;

    background: white;

    border-radius: 12px;

    padding: 25px;

    height: fit-content;

    position: sticky;

    top: 20px;

    box-shadow:
        0 3px 15px
        rgba(0,0,0,0.08);
}


.info-panel h2 {

    margin-top: 0;

    font-size: 24px;
}


.info-item {

    margin-bottom: 16px;
}


.info-label {

    font-size: 12px;

    color: #888;

    margin-bottom: 4px;
}


.info-value {

    font-size: 16px;

    font-weight: 500;
}


.info-panel hr {

    border: none;

    border-top: 1px solid #ddd;

    margin: 20px 0;
}


/* =========================
   手機版
========================= */

@media (max-width: 900px) {

    .container {

        flex-direction: column;
    }

    .info-panel {

        width: 100%;

        position: relative;
    }

}

</style>

</head>


<body>


<header>

<h1>
歐洲歷史互動時間軸
</h1>

<p>
England · France · Holy Roman Empire
｜1000–1600
</p>

</header>



<div class="container">


<!-- =================================
     時間軸
================================= -->

<div class="timeline-area">


<!-- 年份 -->

<div
    class="years"
    id="years">
</div>


<!-- 國家 -->

<div id="timeline"></div>


</div>



<!-- =================================
     資訊面板
================================= -->

<aside
    class="info-panel"
    id="infoPanel">

<h2>
選擇一位君王
</h2>

<p>
點擊時間軸上的君王，
這裡會顯示詳細資訊。
</p>

</aside>


</div>



<script>

/* ===================================
   時間範圍
=================================== */

const START_YEAR = 1000;

const END_YEAR = 1600;


/* ===================================
   歷史資料
=================================== */

const countries = [

    {

        name: "🇬🇧 英格蘭",

        className: "england",

        rulers: [

            {
                name: "William I",
                start: 1066,
                end: 1087,
                dynasty: "Norman"
            },

            {
                name: "Henry I",
                start: 1100,
                end: 1135,
                dynasty: "Norman"
            },

            {
                name: "Henry II",
                start: 1154,
                end: 1189,
                dynasty: "Plantagenet"
            },

            {
                name: "Henry VIII",
                start: 1509,
                end: 1547,
                dynasty: "Tudor"
            }

        ]

    },


    {

        name: "🇫🇷 法國",

        className: "france",

        rulers: [

            {
                name: "Philip VI",
                start: 1328,
                end: 1350,
                dynasty: "Valois"
            },

            {
                name: "Charles V",
                start: 1364,
                end: 1380,
                dynasty: "Valois"
            },

            {
                name: "Francis I",
                start: 1515,
                end: 1547,
                dynasty: "Valois-Angoulême"
            }

        ]

    },


    {

        name: "🏰 神聖羅馬帝國",

        className: "hre",

        rulers: [

            {
                name: "Henry II",
                start: 1002,
                end: 1024,
                dynasty: "Ottonian"
            },

            {
                name: "Frederick I",
                start: 1152,
                end: 1190,
                dynasty: "Hohenstaufen"
            },

            {
                name: "Charles V",
                start: 1519,
                end: 1556,
                dynasty: "Habsburg"
            }

        ]

    }

];


/* ===================================
   年份 → 百分比
=================================== */

function yearToPercent(year) {

    return (
        (year - START_YEAR)
        /
        (END_YEAR - START_YEAR)
    ) * 100;

}


/* ===================================
   建立年份
=================================== */

function createYears() {

    const years =
        document.getElementById("years");


    for (
        let year = START_YEAR;
        year <= END_YEAR;
        year += 100
    ) {

        const element =
            document.createElement("div");


        element.className = "year";


        element.innerText = year;


        element.style.left =
            yearToPercent(year) + "%";


        years.appendChild(element);

    }

}


/* ===================================
   建立時間軸
=================================== */

function createTimeline() {

    const timeline =
        document.getElementById("timeline");


    countries.forEach(country => {


        const countryElement =
            document.createElement("div");


        countryElement.className =
            "country";


        /* 國家名稱 */

        const countryName =
            document.createElement("div");


        countryName.className =
            "country-name";


        countryName.innerText =
            country.name;


        countryElement.appendChild(
            countryName
        );


        /* 君王區域 */

        const rulers =
            document.createElement("div");


        rulers.className =
            "rulers";


        country.rulers.forEach(
            (ruler, index) => {


            const button =
                document.createElement("button");


            button.className =
                "ruler "
                +
                country.className;


            /* =========================
               核心：
               用年份自動計算位置
            ========================= */

            const left =
                yearToPercent(
                    ruler.start
                );


            const width =
                yearToPercent(
                    ruler.end
                )
                -
                yearToPercent(
                    ruler.start
                );


            button.style.left =
                left + "%";


            button.style.width =
                width + "%";


            /*
                同一國家如果君王重疊，
                就讓他們上下排列。
            */

            button.style.top =
                (index % 2) * 55
                + 10
                + "px";


            button.innerHTML = `

                <div class="ruler-name">

                    ${ruler.name}

                </div>

                <div class="ruler-years">

                    ${ruler.start}
                    –
                    ${ruler.end}

                </div>

            `;


            /* 點擊 */

            button.onclick =
                function() {

                    showRuler(
                        ruler,
                        country
                    );

                };


            rulers.appendChild(
                button
            );

        });


        countryElement.appendChild(
            rulers
        );


        timeline.appendChild(
            countryElement
        );

    });

}


/* ===================================
   顯示君王資訊
=================================== */

function showRuler(
    ruler,
    country
) {

    const panel =
        document.getElementById(
            "infoPanel"
        );


    panel.innerHTML = `

        <h2>
            ${ruler.name}
        </h2>


        <div class="info-item">

            <div class="info-label">
                國家
            </div>

            <div class="info-value">
                ${country.name}
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                在位期間
            </div>

            <div class="info-value">
                ${ruler.start}
                –
                ${ruler.end}
            </div>

        </div>


        <div class="info-item">

            <div class="info-label">
                王朝
            </div>

            <div class="info-value">
                ${ruler.dynasty}
            </div>

        </div>


        <hr>


        <div class="info-item">

            <div class="info-label">
                🎧 Podcast
            </div>

            <p>
                之後可以在這裡放
                Spotify / YouTube
                Podcast 播放器。
            </p>

        </div>


        <div class="info-item">

            <div class="info-label">
                📚 延伸閱讀
            </div>

            <a href="#">

                Wikipedia

            </a>

        </div>

    `;

}


/* ===================================
   啟動
=================================== */
async function loadGoogleSheet() {

    const sheetURL =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vRVkmsLln3MzZ7wG4hR7d-XsSZ6YPGARzDmrzMk61yO_qNdMjW4JA9lvUD1V7F6T1ArXQ4RJSk3W0TW/pub?output=csv";


    try {

        const response =
            await fetch(sheetURL);


        const csv =
            await response.text();


        console.log(csv);


        const rows =
            csv.trim().split("\n");


        const headers =
            rows[0].split(",");


        const data =
            rows.slice(1).map(row => {

                const values =
                    row.split(",");


                return {

                    id: values[0],

                    country: values[1],

                    ruler: values[2],

                    dynasty: values[3],

                    start: Number(values[4]),

                    end: Number(values[5])

                };

            });


        console.log(
            "Google Sheets 資料：",
            data
        );


    } catch (error) {

        console.error(
            "讀取 Google Sheets 失敗：",
            error
        );

    }

}
createYears();

loadGoogleSheet();

</script>


</body>

</html>
